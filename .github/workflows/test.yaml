name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/test.yaml'
      - 'flake.nix'
      - 'flake.lock'
      - 'home-modules/**'
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/test.yaml'
      - 'flake.nix'
      - 'flake.lock'
      - 'home-modules/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  user-repo:
    name: Test config-repository-based setup
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        flake-target:
          - user
          - user-desktop
    permissions:
      contents: read
    uses: ut-issl/issl-ubuntu-environment-setup/.github/workflows/test-config-repository.yaml@089f8f8da2627ff345ae2eac1b6da7b3559ada28 # v0.8.10
    with:
      os: ${{ matrix.os }}
      flake-target: ${{ matrix.flake-target }}
      common-repository: ut-issl/issl-ubuntu-environment-setup
      common-ref: 089f8f8da2627ff345ae2eac1b6da7b3559ada28 # v0.8.10
      user-repository: ${{ github.repository }}
      user-ref: ${{ github.sha }}
      override-issl-input: false
      timeout-minutes: 10
