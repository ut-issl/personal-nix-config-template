name: Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yaml
      - flake.nix
      - flake.lock
      - home-modules/**
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/test.yaml
      - flake.nix
      - flake.lock
      - home-modules/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  user-repo:
    name: Test config-repository-based setup
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        flake-target:
          - user
          - user-zsh
        include:
          - flake-target: user
            zsh-enabled: false
          - flake-target: user-zsh
            zsh-enabled: true
    uses: ut-issl/issl-ubuntu-environment-setup/.github/workflows/test-config-repository.yaml@da9a531db23fe8908c90d65dc73155945d20d071 # v0.8.0
    with:
      os: ${{ matrix.os }}
      flake-target: ${{ matrix.flake-target }}
      zsh-enabled: ${{ matrix.zsh-enabled }}
      common-repository: ut-issl/issl-ubuntu-environment-setup
      common-ref: da9a531db23fe8908c90d65dc73155945d20d071 # v0.8.0
      user-repository: ${{ github.repository }}
      user-ref: ${{ github.sha }}
      override-issl-input: false
      timeout-minutes: 10
